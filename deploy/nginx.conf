# Один домен для всего: статика клиента, API, вебхуки платежей и WebSocket сервера гонок.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  # Модели и города — долго в кэше (имена файлов меняются вместе с содержимым редко,
  # поэтому сутки; хэшированные бандлы Vite — год)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~ ^/(cars|cities|wheels|tracks|maps)/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /webhooks/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Только WebSocket: внутренние HTTP-маршруты сервера гонок (/verify и др.) наружу не открыты
  location = /ws {
    proxy_pass http://race-server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Внутренние маршруты API — только из сети compose
  location /internal/ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
